services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: audittrail
      POSTGRES_PASSWORD: audittrail
      POSTGRES_DB: audittrail
    ports:
      - "5433:5432"
    volumes:
      - audittrail-postgres-data:/var/lib/postgresql/data

volumes:
  audittrail-postgres-data:
